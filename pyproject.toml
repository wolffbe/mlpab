[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlpab"
version = "0.1.0"
description = "MLPlatformAgentBench — ML-platform agent testbed: generated FTI evals driving Claude Code against vendor CLIs, MCP servers, and Python SDKs"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "litellm>=1.55",   # token→USD cost across all agent engines (claude/codex/mistral)
]

[project.optional-dependencies]
# Dev tooling installed by `make install` (pip install -e ".[dev]"), used by
# `make lint` / `make fmt`. isort owns import ordering; ruff owns linting +
# formatting (ruff's own import sorter is left OFF so the two don't fight).
dev = [
    "ruff>=0.6",
    "isort>=5.13",
]

[project.scripts]
mlpab = "mlpab.cli:main"

# Two packages: `mlpab` (src layout) and `evals` (repo root — the generated
# FTI task families + graders + checker adapters, importable in run venvs).
[tool.setuptools.packages.find]
where = ["src", "."]
include = ["mlpab*", "evals*"]

# --- Lint / format -----------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["build", ".venv", "cache"]

[tool.ruff.lint]
# Real-bug-oriented baseline (unused imports/vars, undefined names, f-strings
# missing placeholders, …). NOT `I` — isort owns imports. Ignores cover this
# codebase's INTENTIONAL style so lint stays signal, not noise:
#   E501 — long descriptive comment lines are deliberate
#   E702 — compact `a; b` statements (esp. the platform setup/teardown scripts)
#   E741 — single-letter names (l/e/c) used locally on purpose
select = ["E", "F", "W"]
ignore = ["E501", "E702", "E741"]

[tool.ruff.format]
quote-style = "double"

[tool.isort]
profile = "black"
line_length = 100
skip = ["build", ".venv", "cache"]
