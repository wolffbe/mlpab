# SECOND RUN — skills experiment (code optimization x OPTIMIZED skills).
# opt5-quiet CLI + skills tuned to it (global --quiet).
#
# Goal: vs the run-1 no-skills arms AND the cli+official baseline, reduce local
# time + cost and lift assert rate, WITHOUT overfitting (skills are general,
# CLI-first, no task names / no assert-specific steps).
#
# Baseline A (plain cli + OFFICIAL skills) is NOT re-run here: reuse config
# `1_hw-full-cli-sdk-skills-opus`, interface=cli, skills=official.
# Compare in results.csv by `skills` (none / official / optimized*) at fixed model+interface.

model:
  - claude-opus-4-8
auth: login
n: 1

max_seconds: 3600

tasks:
  feature: [ingest, backfill, mit, validate, incremental_load, full_reload, training_data, leakage]
  training: [train, mdt, register, llm_finetuning]
  inference: [batch, online, odt, skew, llm_serving, recsys, vector_search]
  ops: [drift, prediction_monitoring, scheduled_jobs, alerting, lineage]
  capstone: [ccfraud, airquality]

interfaces:
  - {config: configs/platforms/hopsworks/cli-opt5-quiet.yaml}

skills:
  - {config: configs/platforms/hopsworks/skills.yaml, bundle: optimized-opt5-quiet}
