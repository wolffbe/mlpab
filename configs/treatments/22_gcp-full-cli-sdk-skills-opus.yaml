# GCP (Vertex AI) model run — Opus. Parallels treatments 1-4 (hopsworks) and 18
# (databricks), on GCP: same FTI task suite, both interfaces (cli/sdk), with and
# without the vendor's official agent skills. Compare in results.csv by skills
# (none / official) and interface at fixed model+platform.
#
# Per-run isolated: the runner mints a per-run id so the agent lands feature
# tables in its own BigQuery dataset (GCP_BQ_DATASET=mlpab_<run>) and prefixes
# every Vertex/monitoring resource with MLPAB_GCP_PREFIX; teardown scopes to it.

model:
  - claude-opus-4-8
auth: login
n: 1

max_seconds: 3600

tasks:
  feature: [ingest, backfill, mit, validate, incremental_load, full_reload, training_data, leakage]
  training: [train, mdt, register, llm_finetuning]
  inference: [batch, online, odt, skew, llm_serving, recsys, vector_search]
  ops: [drift, prediction_monitoring, scheduled_jobs, alerting, lineage]
  capstone: [ccfraud, airquality]

interfaces:
  - {config: configs/platforms/gcp/cli.yaml}
  - {config: configs/platforms/gcp/sdk.yaml}

skills:
  - none
  - {config: configs/platforms/gcp/skills.yaml}
