# none smoke benchmark — no platform, no skills. Verifies the testbed pipeline
# end to end (mle-bench data prep, fresh venv, claude -p, grader) before doing
# anything heavier. The `none` control has no platform config and no
# autoresearch (there is nothing to improve).
#
# Run:
#   banter platforms/none/benchmark/config.yaml

engineer_model: claude-sonnet-4-6
timeout_s: 3600

runs:
  - challenge: aerial-cactus-identification
    task: image_classification
    platform: none
    interface: none
    skills: none
