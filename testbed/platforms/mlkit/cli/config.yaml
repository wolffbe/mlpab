# mlkit CLI — a fake AutoML CLI (`mlkit`) talking to a tiny local platform
# server (auto-started in the background). Source is co-located here and IS the
# base (v0) version; preflight builds + installs the wheel (no PyPI).
#
# Fake auth: `mlkit login` sends MLKIT_API_KEY to the platform (401 if empty):
#   banter setup platforms/mlkit/cli/config.yaml   (or `make setup`)

# Build metadata (the build generates pyproject.toml from this, so the folder
# stays config.yaml + source). `install:` only BUILDS the wheel into
# $INTERFACE_DIR — it does NOT install into the base .venv. Preflight verifies
# in a throwaway venv and each run installs (runtime_install) into its own venv.
package:
  name: mlkit-cli
  version: "0.1.0"
  requires-python: ">=3.10"
  description: "mlkit CLI (testbed fake AutoML interface)."
  packages: [mlkit_cli]
  scripts:
    mlkit: mlkit_cli.cli:main
install:
  - pip wheel . --no-deps --no-build-isolation -w $INTERFACE_DIR
auth_command: mlkit login        # fake auth — fails (401) when the key is empty
test_command: mlkit --version    # deterministic "does it run?" check

binary: mlkit_cli-0.1.0-py3-none-any.whl
# The invokable command name, used to account `mlkit ...` calls as cli_calls
# (the `binary` above is the wheel artifact, not the command).
cli_command: mlkit
runtime_install:
  - pip install --no-deps $INTERFACE_DIR/mlkit_cli-0.1.0-py3-none-any.whl

# Stop the local platform server (port 8765) at run start + end so each challenge
# starts completely fresh and nothing persists across runs.
teardown:
  - 'P=$(lsof -ti tcp:8765 2>/dev/null); [ -n "$P" ] && kill $P 2>/dev/null || true'

# Credential key for the fake auth — name only; value resolves from testbed/.env
# (the fixed fake key "mlkit"). Injected into the engineer env at run time.
keys:
  - MLKIT_API_KEY

# Outbound hosts the engineer's sandbox is allowed to reach when this
# interface is in play (on top of the testbed baseline: Claude API +
# loopback). mlkit talks to its own local platform on 127.0.0.1:8765, which
# loopback already covers — no extra hosts needed here. Empty list means
# the engineer is restricted to the baseline.
allowed_domains: []

prompt: |
  An `mlkit` AutoML CLI is installed and authenticated. Use it to solve the
  competition:
    - `mlkit fit --data data` to train a model.
    - `mlkit predict --model <id> --data data --out submission/submission.csv`
      to write the submission.
  Run `mlkit --help` for details.
