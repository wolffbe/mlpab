# mlkit MCP — a REMOTE HTTP MCP server (official mcp SDK / FastMCP,
# streamable-http) exposing mlkit's fake AutoML as `fit` and `predict` tools.
# Configured in Claude Code as a remote HTTP server. Source is co-located here
# and IS the base (v0) version.
#
# Preflight (deterministic, no LLM): build + install (with the `mcp` extra), log
# in (fake auth), start the HTTP server, register it with `claude mcp add
# --transport http`, and verify Claude can reach it with `claude mcp get`.
#
# NOTE: the `[mcp]` extra installs the official `mcp` package from PyPI (network).
#   banter setup platforms/mlkit/mcp/config.yaml   (or `make setup`)

# `install:` only BUILDS the wheel into $INTERFACE_DIR — it does NOT install into
# the base .venv (so the heavy `mcp` dep tree never pollutes other runs).
# Preflight verifies in a throwaway venv and each run installs (runtime_install)
# the `[mcp]` extra into its own venv.
install:
  - pip wheel . --no-deps --no-build-isolation -w $INTERFACE_DIR
auth_command: mlkit-mcp login      # fake auth (401 if key empty)
# Start the HTTP server, add it to Claude as a remote HTTP server, and check the
# engineer (Claude) can access it — all deterministic (no LLM).
test_command: |
  mlkit-mcp ensure &&
  (claude mcp remove mlkit >/dev/null 2>&1 || true) &&
  claude mcp add --transport http mlkit ${MLKIT_MCP_URL:-http://127.0.0.1:8766/mcp} &&
  claude mcp get mlkit &&
  (claude mcp remove mlkit >/dev/null 2>&1 || true)

binary: mlkit_mcp-0.1.0-py3-none-any.whl
runtime_install:
  - 'pip install "$INTERFACE_DIR/mlkit_mcp-0.1.0-py3-none-any.whl[mcp]"'
# Start the MCP HTTP server (port 8766) for THIS run before the engineer's claude
# connects to it (`--mcp-config`). Without this the tools never register and the
# engineer falls back to writing its own code.
serve:
  - mlkit-mcp ensure
mcp_servers:
  mlkit:
    type: http
    url: http://127.0.0.1:8766/mcp

# Stop the MCP server (8766) and the platform it calls (8765), and clear any
# stray global registration, at run start + end — each challenge starts fresh.
teardown:
  - 'P=$(lsof -ti tcp:8766 2>/dev/null); [ -n "$P" ] && kill $P 2>/dev/null || true'
  - 'P=$(lsof -ti tcp:8765 2>/dev/null); [ -n "$P" ] && kill $P 2>/dev/null || true'
  - claude mcp remove mlkit >/dev/null 2>&1 || true

keys:
  MLKIT_API_KEY: "mlkit"

prompt: |
  An `mlkit` MCP server is connected over HTTP with tools to solve the
  competition:
    - `mcp__mlkit__fit` to train a model.
    - `mcp__mlkit__predict` to write the submission.
