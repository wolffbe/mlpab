[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "mlkit-mcp"
version = "0.1.0"
requires-python = ">=3.10"
description = "mlkit MCP server (testbed fake AutoML interface)."
[project.optional-dependencies]
mcp = ["mcp"]
[project.scripts]
mlkit-mcp = "mlkit_mcp.server:main"
[tool.setuptools]
packages = ["mlkit_mcp"]
