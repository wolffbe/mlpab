# mlkit SDK autoresearch (INTERFACE) — improve the sdk interface (no skills), one
# task, a few increments. Full offline pipeline: preflight build/test → researcher
# → engineer runs → rollup.
#   banter platforms/mlkit/autoresearch/sdk/mlkit-sdk-ar.yaml
engineer_model: claude-sonnet-4-6
researcher_model: claude-opus-4-5

tasks:
  image_classification: [aerial-cactus-identification]

interfaces:
  - config: platforms/mlkit/sdk/config.yaml

skills: none
improve:
  - interface

goals:
  - {metric: score, direction: maximize}
  - {metric: total_tokens, direction: minimize}
  - {metric: python_calls, direction: minimize}
  - {metric: sdk_calls, direction: maximize}

budget:
  max_increments: 3
  max_cost_usd: .inf
  max_seconds: 28800   # 8h of compute (rate-limit waiting excluded)
