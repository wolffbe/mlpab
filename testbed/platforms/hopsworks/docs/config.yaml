# the run: once at `<run>/docs/` for the researcher, and APFS-copied into each
# engineer challenge at `<challenge>/docs/`.
#
# Docs are STATIC and READ-ONLY: they describe the platform, not the attempt.
# They are never edited across versions, never rebuilt, never measured, and are
# excluded from the interface source fingerprint — purely reference material the
# researcher and engineer can `Read` to learn how Hopsworks really works.
