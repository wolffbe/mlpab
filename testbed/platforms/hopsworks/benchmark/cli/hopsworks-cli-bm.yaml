# Benchmark a specific Hopsworks CLI version against a set of challenges.
#
# Interface versions live inside the autoresearch session that produced them.
# To evaluate an evolved version, pin BOTH the session id and the version
# number (find them in results/autoresearch/<id>/increments.jsonl). Omit
# `session`/`version` (or use version 0) to run the base config.
#
# Interfaces are built, set up, and tested automatically at preflight — there
# is no separate install step.
#
# Run:
#   banter platforms/hopsworks/benchmark/cli/config.yaml

engineer_model: claude-sonnet-4-6
timeout_s: 3600

tasks:
  image_classification: [aerial-cactus-identification]
  # add the challenges you want to score this version against

interfaces:
  # Base config (referenced by its interface config file):
  - {config: platforms/hopsworks/cli/config.yaml}
  # An evolved version (uncomment and fill in):
  # - {config: platforms/hopsworks/cli/config.yaml, session: 0, version: 2}

skills:
  - none
