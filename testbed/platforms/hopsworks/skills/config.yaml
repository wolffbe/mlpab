# Hopsworks skill bundle — provenance for the committed v0 base.
#
# UNLIKE docs (which are git-cloned into each run at runtime, see
# platforms/hopsworks/docs/config.yaml), skills are LOCAL and COMMITTED: they are
# the v0 base that `improve: skills` runs copy and edit per version. `banter run
# --skills hopsworks` (or `skills: hopsworks` in an autoresearch config) copies
# every skill subfolder of `platforms/hopsworks/skills/hopsworks/<skill>/` into
# the run's `.claude/skills/` so Claude Code discovers them. So this file is
# documentation only — `banter` does not read it; the bundle dir IS the source of
# truth.
#
# Source of the vendored bundle:
source: https://github.com/logicalclocks/hopsworks-api/tree/main/skills
repo: https://github.com/logicalclocks/hopsworks-api
ref: 0881cf248aa77920a19a7e7afdd9a64dd2d646dc   # main @ vendoring time
subdir: skills

# The upstream `skills/` dir groups skills into category folders
# (data/ hops/ ml/ platform/), each holding `<skill>/SKILL.md` (+ optional
# references/ and scripts/). banter requires a FLAT bundle — every immediate
# subfolder must itself be a skill with a SKILL.md (see skills.verify_installed) —
# so the categories were FLATTENED into a single bundle of 23 skills. The
# authoring docs (README.md, TEMPLATE_action.md, TEMPLATE_knowledge.md) were
# dropped; per-skill references/ and scripts/ were preserved. Agent plumbing
# (.claude/, CLAUDE.md, .mcp.json, .git) was stripped.
#
# To refresh: re-vendor from the URL above at a new `ref:` and re-flatten, then
# bump the SHA here.
bundle: hopsworks
flattened_from:
  - data
  - hops
  - ml
  - platform
