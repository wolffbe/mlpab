# Hopsworks Python SDK interface — config (where it lives + how to build/run it).
#
# The SDK is BUILT LOCALLY from source (no PyPI). Preflight clones the source
# repo and builds a wheel into the interface binary dir
# (platforms/hopsworks/sdk/), and each engineer run installs THAT local wheel
# into its venv — never `pip install hopsworks` from the index.
#
# This file holds NO versions. The base prompt below is version 0. Improved
# versions are created inside an autoresearch session, under
#   results/autoresearch/<session_id>/platforms/hopsworks/sdk/v<n>/version.yaml
#
# Set keys: banter setup platforms/hopsworks/sdk/config.yaml   (or `make setup`)

# --- Where it lives / how to build it (run automatically at preflight) ---
repo: https://github.com/logicalclocks/hopsworks-api
# Pinned to a FIXED COMMIT for reproducibility: the interface source never drifts
# mid-session, and the per-version copy is never re-pulled (which would clobber a
# researcher's source edits). To advance, update this SHA + delete the built src/.
ref: 16a5b9fa61e2bee4f4807a1ee87d4a4e67346d1f
install:
  # Build the SDK wheel from source into $INTERFACE_DIR, then RENAME it to one
  # fixed, valid wheel filename (the upstream version floats, e.g. 5.0.0.devN —
  # `mv` leaves exactly one wheel in the folder, like the mlkit interfaces). pip
  # reads the real version from the wheel's own metadata, so the fixed `-0-` name
  # is cosmetic. Adjust the `python` sub-path if the repo layout differs.
  - pip install build
  - python -m build --wheel --outdir "$INTERFACE_DIR" python
  - sh -c 'mv "$(ls -t "$INTERFACE_DIR"/hopsworks-*.whl | head -1)" "$INTERFACE_DIR/hopsworks-0-py3-none-any.whl"'

# Deterministic, OFFLINE "does it import?" check (no live cluster): after the
# wheel + deps install, the package imports cleanly.
test_command: python -c "import hopsworks"

# Real connectivity check: log in to the cluster using HOPSWORKS_API_KEY /
# HOPSWORKS_HOST from the environment. Exits non-zero on a bad/missing key, so
# preflight fails fast instead of letting a challenge hit a dead login.
auth_command: python -c "import hopsworks; hopsworks.login()"

# --- How to run it (per engineer run) — install the locally-built wheel with
#     the `[python]` extra (pandas/pyarrow/… the SDK needs for real work). ---
binary: hopsworks-0-py3-none-any.whl
# The `hops` console script ships in the same wheel. It is NOT the interface
# under test here — declaring it lets the engineer hook + command counter treat
# a `hops …` call as an OFF-INTERFACE escape (blocked / counted as such).
cli_command: hops
runtime_install:
  - 'pip install "$INTERFACE_DIR/hopsworks-0-py3-none-any.whl[python]"'

# --- Platform teardown — run automatically by banter at the START and END of
#     every run, so each run (and therefore each autoresearch version) starts and
#     ends with a clean cluster. Deletes every project this API key owns, which
#     cascades away all feature groups / views / training data / models the agent
#     created (POST /hopsworks-api/api/project/{id}/delete). The cleanup logic is
#     the committed platforms/hopsworks/teardown.py — $BANTER_PLATFORM_DIR points
#     there (not the per-version copy), so it's fixed infra; `./venv` is the
#     engineer's run venv (the SDK is installed there). ---
teardown:
  - './venv/bin/python "$BANTER_PLATFORM_DIR/teardown.py"'

# --- Credentials — names only; values resolve from the GLOBAL testbed/.env at
#     run time (never stored here). The SDK reads HOPSWORKS_API_KEY /
#     HOPSWORKS_HOST via hopsworks.login(); the auth_command above verifies them
#     against the live cluster at preflight (`banter test --no-login` skips it). ---
keys:
  - HOPSWORKS_API_KEY   # secret
  - HOPSWORKS_HOST      # Hopsworks endpoint

# --- Base prompt (version 0) ---
prompt: |
  The Hopsworks Python SDK is available (`import hopsworks`; connect with
  `hopsworks.login()` using HOPSWORKS_API_KEY and HOPSWORKS_HOST from the
  environment). Use it when it helps. You can also use local Python or
  install other libraries — pick whatever solves the task best.
