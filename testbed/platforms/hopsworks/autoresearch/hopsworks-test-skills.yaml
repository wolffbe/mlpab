# hopsworks autoresearch (SKILLS) — improve the Hopsworks SKILL BUNDLE in ONE
# config. The engineer works through the MCP interface (fixed, never edited); the
# researcher improves the `hopsworks` skill bundle across versions. v0 is the
# bundle vendored from logicalclocks/hopsworks-api/skills (see
# platforms/hopsworks/skills/config.yaml); v>0 are the researcher's edits.
# Results nest under results/autoresearch/hopsworks-test-skills/<platform>/<interface>/hopsworks/.
#   banter platforms/hopsworks/autoresearch/hopsworks-test-skills.yaml
engineer_model: claude-sonnet-4-6
researcher_model: claude-opus-4-7
language: python

tasks:
  # Tabular regression (predict formation + bandgap energy of transparent
  # conductors from material features). Chosen over image classification because
  # the FTI lifecycle whitelist (feature group → feature view → training data →
  # transformation → model → deployment) is only naturally exercised by a
  # feature-engineering task; a pure image CNN rationally bypasses the Feature
  # Store via a plain training Job, pinning whitelist_hits near zero.
  tabular_regression: [nomad2018-predict-transparent-conductors]

interfaces:
  - config: platforms/hopsworks/cli/config.yaml

# The v0 skill bundle the researcher starts from + improves (improve: skills).
# `hopsworks` = platforms/hopsworks/skills/hopsworks/ (23 skills vendored from
# the hopsworks-api repo). The engineer gets these copied into .claude/skills/.
skills: hopsworks
# Reference docs (platforms/hopsworks/docs/config.yaml → the
# logicalclocks.github.io site, pinned to a fixed commit). Downloaded once to
# <run>/docs/ for the researcher and copied into each <challenge>/docs/ for the
# engineer. Static and read-only — never edited, rebuilt, or measured. Any
# non-`none` name selects the single per-platform docs config.
docs: hopsworks-docs
improve:
  - skills

goals:
  - {metric: whitelist_hits, direction: maximize}   # FTI lifecycle endpoints covered
  # nomad2018 is scored by mean column-wise RMSLE (lower is better natively), but
  # `score` is NORMALIZED to higher-is-better at record time (the runner sign-flips
  # lower-better competitions — see mlebench_wrapper.normalize_score). So the goal
  # is `maximize`: a better (smaller) RMSLE maps to a larger normalized score, and
  # the floor submission (mean of targets) correctly scores LOW, not high.
  - {metric: score, direction: maximize}

# REST-endpoint coverage. The engineer's outbound requests (SDK/CLI/MCP, all via
# `requests` in the run venv) are logged and matched against these patterns
# ("<METHOD> <path-regex>", all under /hopsworks-api/api). whitelist_hits =
# DISTINCT whitelisted endpoints hit (max = #patterns); blacklist_hits = #calls
# matching any blacklist pattern. Whitelist = the FTI lifecycle (create+get for
# feature group, feature view, training data, transformation, model, deployment,
# app). NOTE: `app create` shares `PUT .../jobs/{name}` with `job deploy`, so
# jobs are NOT blacklisted (the FTI uses them for the feature/training pipelines).
endpoints:
  whitelist:
    - 'POST /hopsworks-api/api/project/[0-9]+/featurestores/[0-9]+/featuregroups'              # FG create
    - 'GET /hopsworks-api/api/project/[0-9]+/featurestores/[0-9]+/featuregroups/[^/]+'         # FG get
    - 'POST /hopsworks-api/api/project/[0-9]+/featurestores/[0-9]+/featureview'                # FV create
    - 'GET /hopsworks-api/api/project/[0-9]+/featurestores/[0-9]+/featureview/[^/]+(?:/version/[0-9]+)?'  # FV get (by name, opt /version/N)
    - 'POST /hopsworks-api/api/project/[0-9]+/featurestores/[0-9]+/featureview/[^/]+/version/[0-9]+/trainingdatasets'  # TD create
    - 'GET /hopsworks-api/api/project/[0-9]+/featurestores/[0-9]+/featureview/[^/]+/version/[0-9]+/trainingdatasets'   # TD get
    - 'POST /hopsworks-api/api/project/[0-9]+/featurestores/[0-9]+/transformationfunctions'    # transformation create
    - 'GET /hopsworks-api/api/project/[0-9]+/featurestores/[0-9]+/transformationfunctions'     # transformation get
    - 'PUT /hopsworks-api/api/project/[0-9]+/modelregistries/[0-9]+/models/[^/]+'              # model create
    - 'GET /hopsworks-api/api/project/[0-9]+/modelregistries/[0-9]+/models/[^/]+'              # model get
    - 'PUT /hopsworks-api/api/project/[0-9]+/serving'                                          # deployment create
    - 'GET /hopsworks-api/api/project/[0-9]+/serving(?:/[0-9]+)?'                              # deployment get (by name or /id)
    - 'PUT /hopsworks-api/api/project/[0-9]+/jobs/[^/]+'                                       # app create (== job deploy path)
    - 'GET /hopsworks-api/api/project/[0-9]+/apps(?:/[^/]+)?'                                  # app get (list or /name)
  blacklist: []   # capability available; none forbidden by default

budget:
  iterations: 4
