# hopsworks autoresearch (INTERFACE) — improve the MCP, CLI, and SDK interfaces
# (no skills) in ONE config. Each interface gets its OWN researcher and they
# run SEQUENTIALLY (mcp → cli → sdk); the budget below applies PER interface.
# Results nest under results/autoresearch/hopsworks-test-ar/<platform>/<interface>/none/.
#   banter platforms/hopsworks/autoresearch/hopsworks-test-ar.yaml
engineer_model: claude-sonnet-4-6
researcher_model: claude-opus-4-5
language: python

tasks:
  image_classification: [aerial-cactus-identification]

interfaces:
  - config: platforms/hopsworks/mcp/config.yaml
  - config: platforms/hopsworks/cli/config.yaml
  - config: platforms/hopsworks/sdk/config.yaml

skills: none
improve:
  - interface

goals:
  - {metric: score, direction: maximize}
  - {metric: total_tokens, direction: minimize}
  - {metric: python_calls, direction: minimize}
  - {metric: cli_calls, direction: maximize}   # only fires on the cli interface
  - {metric: mcp_calls, direction: maximize}   # only fires on the mcp interface
  - {metric: sdk_calls, direction: maximize}   # only fires on the sdk interface

budget:
  iterations: 4        # total versions incl. v0 baseline (v0, v1, v2, v3)
  max_seconds: 28800   # 8h of compute (rate-limit waiting excluded)
  # max_cost_usd unset → unlimited (inf) by default
