# =============================================================================
# RQ3 — Skills layer on top of frozen RQ1/RQ2 interface winners
# =============================================================================
#
# Sequence:
#   RQ1 → autoresearch the interfaces (general-purpose, 8 challenges)
#         → produces winning versions for cli / mcp / sdk
#   RQ2 → autoresearch the interfaces specialised per challenge
#         → produces specialised winning versions (per category, per challenge)
#   RQ3 → freeze the winning interfaces, autoresearch a SKILL BUNDLE on top
#         → 10 increments, interface only used as a constant
#
# This file is the RQ3 template for the GENERAL-PURPOSE (RQ1) winners. After
# RQ1 finishes, look at its results.csv to find each interface's winning
# version, then fill in the `version:` numbers below. For RQ2 specialised
# follow-ups, copy this file per category and pin the challenge-specific
# versions in `interfaces:` plus restrict `tasks:` to the category's
# challenges.
#
# Hypothesis (RQ3): given a fixed, RQ1-optimised interface, an autoresearch-
# generated skill bundle can extract further improvement on the same goals
# (task success, tokens, remote-platform delegation) — i.e. skills are
# additive, not redundant with prompt refinements. (Wall-clock time is
# charted for reference but is not an optimisation goal.)
#
# Run:
#   1. First complete RQ1 and note the winning version per interface AND the RQ1
#      config name (its results.csv rows carry `version` + the annotate-version
#      `verdict`/`keep` columns marking each scope's winner).
#   2. Fill in `session:` + `version:` for each entry below.
#   3. Run: banter platforms/hopsworks/autoresearch/rq3.yaml
#
# Versions are session-local, so the RQ3 session pins the RQ1 session's
# versions via `session:`. "Resetting" RQ3 = deleting the RQ3 session dir.
# =============================================================================

engineer_model: claude-sonnet-4-6
researcher_model: claude-opus-4-5

# Same tasks as RQ1 (one challenge per task) — direct comparability of RQ3
# (with skills) vs RQ1 (without) on identical interface versions.
tasks:
  image_classification:   [aerial-cactus-identification]
  image_to_image:         [denoising-dirty-documents]
  text_classification:    [jigsaw-toxic-comment-classification-challenge]
  image_regression:       [histopathologic-cancer-detection]
  audio_classification:   [mlsp-2013-birds]
  tabular:                [nomad2018-predict-transparent-conductors]
  sequence_to_sequence:   [text-normalization-challenge-english-language]

# -----------------------------------------------------------------------------
# Interfaces — referenced by config, PINNED to RQ1 winners. Each pinned version
# lives in the RQ1 session, so set BOTH `session:` (the RQ1 session id) and
# `version:`. Omit both to use the base config (version 0).
# -----------------------------------------------------------------------------
interfaces:
  - config: platforms/hopsworks/cli/config.yaml
    # session: <RQ1 session id, e.g. 0>   # ← the RQ1 session that produced the winner
    # version: 0                  # ← the winning CLI version from RQ1
  - config: platforms/hopsworks/mcp/config.yaml
    # session: <RQ1 session id, e.g. 0>
    # version: 0                  # ← the winning MCP version from RQ1
  - config: platforms/hopsworks/sdk/config.yaml
    # session: <RQ1 session id, e.g. 0>
    # version: 0                  # ← the winning SDK version from RQ1

# Start from nothing — the researcher CREATES its own skill bundle from scratch
# and improves it across increments (improve: skills, below).
skills: none

# -----------------------------------------------------------------------------
# Improvement scope — SKILLS ONLY. Interfaces are frozen at the RQ1 winners.
# -----------------------------------------------------------------------------
improve:
  - skills

# Same goals as RQ1 so we can compare apples to apples.
goals:
  - metric: score
    direction: maximize
  - metric: total_tokens
    direction: minimize
  - metric: python_calls
    direction: minimize
  - metric: cli_calls
    direction: maximize
  - metric: mcp_calls
    direction: maximize
  - metric: sdk_calls
    direction: maximize

# Budget is PER interface: 10 increments × 8 challenges = up to 80 runs each,
# ×3 interfaces = up to 240 total. `max_seconds` is the COMPUTE budget (wall
# clock minus rate-limit waiting); the researcher stops gracefully when hit.
budget:
  max_seconds: 28800   # 8h of compute (rate-limit waiting excluded)