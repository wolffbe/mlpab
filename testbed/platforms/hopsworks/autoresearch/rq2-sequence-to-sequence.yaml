# =============================================================================
# RQ2 / Seq->Seq — specialised Hopsworks CLI + MCP + SDK interfaces for this task
# =============================================================================
# Autoresearch the cli, mcp, and sdk interfaces (SEQUENTIALLY — one researcher
# each) specialised for the Seq->Seq task, using its 2 smallest challenge(s)  (only 2 challenge(s) exist for this task).
# Budget applies PER interface (max_increments defaults to 10); each researcher
# stops at 95% of the 5h usage window. Results land under
# results/autoresearch/rq2-sequence-to-sequence/<platform>/<interface>/none/.
#   banter platforms/hopsworks/autoresearch/rq2-sequence-to-sequence.yaml
# =============================================================================
engineer_model: claude-sonnet-4-6
researcher_model: claude-opus-4-5

# The 2 smallest Seq->Seq challenge(s) by dataset size.
tasks:
  sequence_to_sequence:
    - text-normalization-challenge-english-language # 0.01 GB
    - text-normalization-challenge-russian-language # 0.01 GB

# CLI + MCP + SDK, referenced by their interface config files.
interfaces:
  - config: platforms/hopsworks/cli/config.yaml
  - config: platforms/hopsworks/mcp/config.yaml
  - config: platforms/hopsworks/sdk/config.yaml

skills: none
improve:
  - interface

# Same goal set/directions as RQ1 — direct comparability. The per-interface
# usage metric only fires on its own interface (cli_calls on cli, etc.).
goals:
  - {metric: score, direction: maximize}
  - {metric: total_tokens, direction: minimize}
  - {metric: python_calls, direction: minimize}
  - {metric: cli_calls, direction: maximize}
  - {metric: mcp_calls, direction: maximize}
  - {metric: sdk_calls, direction: maximize}

budget:
  max_seconds: 28800   # 8h of compute (rate-limit waiting excluded)
