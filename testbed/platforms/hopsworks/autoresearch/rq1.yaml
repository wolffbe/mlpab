# =============================================================================
# RQ1 — Improving the Hopsworks CLI, MCP, and SDK interfaces (NO skills)
# =============================================================================
#
# Research-question structure:
#   RQ1 (this file) = interface-only optimisation across CLI + MCP + SDK.
#                     The interfaces run SEQUENTIALLY — one independent
#                     researcher per interface — and the budget below applies
#                     PER interface: 10 increments × 8 challenges = up to 80
#                     runs each, ×3 interfaces = up to 240 runs total.
#   RQ3 (later)     = layer skills on top of the winning RQ1 versions
#                     for each interface, 10 increments each.
#
# Hypothesis (RQ1): refining each interface's prompt and per-version config
# (no skills) is sufficient to achieve (1) higher MLE-bench task success,
# (2) lower token consumption, and (3) greater delegation to the remote
# Hopsworks platform — measured per-interface as cli_calls / mcp_calls /
# sdk_calls — over locally-executed Python. (Wall-clock time is charted in
# the analysis for reference but is NOT an optimisation goal.)
#
# How the loop works (per interface, one after the other):
#   Per increment:
#     - Run all 8 challenges with this interface (8 runs/increment).
#     - Researcher Claude reads this interface's results.csv, computes the
#       AVERAGED metrics across the 8 challenges.
#     - Prepares the next version (`banter prepare-version`) and edits the
#       interface SOURCE — ONE targeted change so attribution is clean.
#     - Re-runs all 8 challenges against the new version.
#     - Keeps the change only if the averaged goals improved.
#   Repeats for max_increments increments, then moves to the next interface.
#
# Prerequisites (one-time):
#   make setup    # auth for engineer + researcher, plus interface keys
#   # Interfaces are built, set up, and tested automatically at preflight.
#
# Run:
#   banter platforms/hopsworks/autoresearch/rq1.yaml
#
# Results land under results/autoresearch/<config-name>/<platform>/<interface>/
# <skills>/v<N>/<task>/<challenge>/ (config-name = this file's stem, `rq1`).
# Re-running the same config overwrites that folder (after a y/N prompt; `-y`
# skips). Versions are session-local, so "resetting" is just deleting the dir.
# =============================================================================

engineer_model: claude-sonnet-4-6
researcher_model: claude-opus-4-5

# -----------------------------------------------------------------------------
# Tasks (ML task type → its challenges). RQ1 = ONE challenge per task.
# -----------------------------------------------------------------------------
tasks:
  image_classification:   [aerial-cactus-identification]                  # 25 MB
  image_to_image:         [denoising-dirty-documents]                     # 60 MB
  text_classification:    [jigsaw-toxic-comment-classification-challenge] # 2 MB
  image_regression:       [histopathologic-cancer-detection]             # 7.76 GB
  audio_classification:   [mlsp-2013-birds]                              # 585 MB
  tabular:                [nomad2018-predict-transparent-conductors]      # 6 MB
  tabular_large:          [tabular-playground-series-dec-2021]            # 700 MB
  sequence_to_sequence:   [text-normalization-challenge-english-language] # 10 MB

# -----------------------------------------------------------------------------
# Three Hopsworks interfaces, each autoresearched SEQUENTIALLY by its own
# researcher, referenced by their config files (where each interface lives +
# how it is built/run).
# -----------------------------------------------------------------------------
interfaces:
  - config: platforms/hopsworks/cli/config.yaml
  - config: platforms/hopsworks/mcp/config.yaml
  - config: platforms/hopsworks/sdk/config.yaml
skills: none

# -----------------------------------------------------------------------------
# Improvement scope — INTERFACE ONLY (skills are RQ3)
# -----------------------------------------------------------------------------
improve:
  - interface

# -----------------------------------------------------------------------------
# Goals — direction-only. The researcher tracks each metric per interface.
# -----------------------------------------------------------------------------
# Note: by default every *_calls metric is treated as minimize. We override
# cli_calls, mcp_calls, and sdk_calls to MAXIMIZE — using the remote
# Hopsworks platform more is the whole point of this RQ.
goals:
  - metric: score                  # MLE-bench accuracy
    direction: maximize
  - metric: total_tokens           # cost / efficiency
    direction: minimize
  - metric: python_calls           # less local Python = more remote delegation
    direction: minimize
  - metric: cli_calls              # more Hopsworks CLI usage (only fires on cli runs)
    direction: maximize
  - metric: mcp_calls              # more Hopsworks MCP usage (only fires on mcp runs)
    direction: maximize
  - metric: sdk_calls              # more Hopsworks SDK usage (only fires on sdk runs)
    direction: maximize

# -----------------------------------------------------------------------------
# Budget is PER interface: 10 increments × 8 challenges = up to 80 runs each,
# ×3 interfaces = up to 240 runs total. No cost cap. `max_seconds` is the
# COMPUTE budget (wall clock MINUS time spent waiting on rate limits); the
# researcher stops gracefully at the version boundary once it's hit.
# -----------------------------------------------------------------------------
budget:
  max_seconds: 28800   # 8h of compute (rate-limit waiting excluded)