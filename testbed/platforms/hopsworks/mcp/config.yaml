# Hopsworks MCP interface — the `hopsworks-mcp` server shipped IN hopsworks-api
# (python/hopsworks/mcp, console script `hopsworks-mcp` → hopsworks.mcp:run_server_command).
#
# Built LOCALLY from source (no PyPI): preflight builds the hopsworks wheel from
# the repo's python/ dir into $INTERFACE_DIR and each engineer run installs THAT
# wheel (with the `[mcp]` extra) into its venv. Same wheel as the SDK + CLI
# interfaces — only the entry point (the MCP server) differs.
#
# This file holds NO versions. The base prompt below is version 0; improved
# versions are created inside an autoresearch session under
#   results/autoresearch/<session_id>/.../hopsworks/mcp/v<n>/.
#
# Set keys: edit the global testbed/.env (see `keys:` below).

# --- Where it lives / how to build it (run automatically at preflight) ---
repo: https://github.com/logicalclocks/hopsworks-api
ref: main
install:
  # Build the wheel from source into $INTERFACE_DIR, then RENAME it to one fixed,
  # valid wheel filename (upstream version floats, e.g. 5.0.0.devN — `mv` leaves
  # exactly one wheel, like the mlkit interfaces). pip reads the real version from
  # the wheel's own metadata, so the fixed `-0-` name is cosmetic.
  - pip install build
  - python -m build --wheel --outdir "$INTERFACE_DIR" python
  - sh -c 'mv "$(ls -t "$INTERFACE_DIR"/hopsworks-*.whl | head -1)" "$INTERFACE_DIR/hopsworks-0-py3-none-any.whl"'

# Deterministic, OFFLINE "does it run?" check (no live cluster): the server
# command installs and responds to --help.
test_command: hopsworks-mcp --help

# Real connectivity check: the MCP server connects with HOPSWORKS_API_KEY /
# HOPSWORKS_HOST at runtime, so validate those same credentials at preflight via
# `hops login` (shipped in the same wheel). Non-interactive when both are set,
# exits non-zero on a bad/missing key; `--no-save-key` leaves no state behind.
auth_command: hops login --no-save-key

# --- How to run it (per engineer run) — install the locally-built wheel with
#     the `[mcp]` extra (the MCP server deps); `[python]` for SDK deps too. ---
binary: hopsworks-0-py3-none-any.whl
runtime_install:
  - 'pip install "$INTERFACE_DIR/hopsworks-0-py3-none-any.whl[mcp,python]"'

# --- MCP server: Claude Code launches it over stdio per run (reads the keys
#     below from the environment to connect to Hopsworks). ---
mcp_servers:
  hopsworks:
    command: hopsworks-mcp
    args: ["--transport", "stdio"]
    env: {}

# --- Credentials — names only; values resolve from the GLOBAL testbed/.env at
#     run time (never stored here), injected into the engineer's env AND the MCP
#     server's. ---
keys:
  - HOPSWORKS_API_KEY   # secret
  - HOPSWORKS_HOST      # Hopsworks endpoint

# --- Base prompt (version 0) ---
prompt: |
  Hopsworks MCP server tools (prefixed `mcp__hopsworks__`) are available and
  authenticated via HOPSWORKS_API_KEY and HOPSWORKS_HOST from the environment.
  Use them for Hopsworks operations when they help.
