# Hopsworks MCP interface — config (how to build + run the MCP server).
#
# This file holds NO versions. The base prompt below is version 0. Improved
# versions are created inside an autoresearch session, under
#   results/autoresearch/<session_id>/platforms/hopsworks/mcp/v<n>/version.yaml
#
# Build:    automatic at preflight (runs the `install:` steps below).
# Set keys: banter setup platforms/hopsworks/mcp/config.yaml   (or `make setup`)

# --- Where it lives / how to build it (TODO: set repo + install steps once
#     the MCP server is available). The built server binary (if any) goes into
#     platforms/hopsworks/mcp/ ($INTERFACE_DIR). ---
repo: null
ref: main
install:
  - "echo 'TODO: set repo + install in platforms/hopsworks/mcp/config.yaml'"
  - "false"

# Deterministic "does it actually run?" check (no AI). Set once the server
# binary exists, e.g. a quick `--version` that exits 0. Left unset by default.
# test_command: hopsworks-mcp --version

# --- How to run it (per engineer run) ---
mcp_servers:
  hopsworks:
    command: hopsworks-mcp
    args: []
    env: {}

# --- Credentials (injected into the engineer's environment and the MCP server) ---
keys:
  HOPSWORKS_API_KEY: ""
  HOPSWORKS_HOST: ""

# --- Base prompt (version 0) ---
prompt: |
  Hopsworks MCP server tools (prefixed `mcp__hopsworks__`) are available.
  Use them when they help. You can also use local Python or install
  other libraries — pick whatever solves the task best.
