[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlpab"
version = "0.1.0"
description = "MLPlatformAgentBench — ML-platform agent testbed: generated FTI evals driving Claude Code against vendor CLIs, MCP servers, and Python SDKs"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "litellm>=1.55",   # token→USD cost across all agent engines (claude/codex/mistral)
]

[project.scripts]
mlpab = "mlpab.cli:main"

# Two packages: `mlpab` (src layout) and `evals` (repo root — the generated
# FTI task families + graders + checker adapters, importable in run venvs).
[tool.setuptools.packages.find]
where = ["src", "."]
include = ["mlpab*", "evals*"]
