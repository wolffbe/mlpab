[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "banter"
version = "0.1.0"
description = "ML-platform agent testbed: generated FTI evals driving Claude Code against vendor CLIs, MCP servers, and Python SDKs"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
]

[project.scripts]
banter = "banter.cli:main"

# Two packages: `banter` (src layout) and `evals` (repo root — the generated
# FTI task families + graders + checker adapters, importable in run venvs).
[tool.setuptools.packages.find]
where = ["src", "."]
include = ["banter*", "evals*"]
