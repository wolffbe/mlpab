# mlkit CLI autoresearch (SKILLS) — improve the mlkit skill bundle on the cli
# interface. Exercises the skill-access probe + session-local skill versions.
#   banter interfaces/mlkit/autoresearch/cli/mlkit-cli-skills-ar.yaml
engineer_model: claude-sonnet-4-6
researcher_model: claude-opus-4-5

tasks:
  image_classification: [aerial-cactus-identification]

interfaces:
  - config: interfaces/mlkit/cli/config.yaml

skills: mlkit
improve:
  - skills

goals:
  - {metric: score, direction: maximize}
  - {metric: total_tokens, direction: minimize}
  - {metric: python_calls, direction: minimize}
  - {metric: cli_calls, direction: maximize}
  - {metric: skill_calls, direction: maximize}

budget:
  max_increments: 3
  max_cost_usd: .inf
  max_seconds: 28800   # 8h of compute (rate-limit waiting excluded)
