# mlkit MCP autoresearch (SKILLS) — improve the mlkit skill bundle on the mcp
# interface. Exercises the skill-access probe + session-local skill versions.
#   banter interfaces/mlkit/autoresearch/mcp/skills.yaml
engineer_model: claude-sonnet-4-6
researcher_model: claude-opus-4-7

tasks:
  image_classification: [aerial-cactus-identification]

interfaces:
  - config: interfaces/mlkit/mcp/config.yaml

skills: mlkit
improve:
  - skills

goals:
  - {metric: score, direction: maximize}
  - {metric: total_tokens, direction: minimize}
  - {metric: wall_time_s, direction: minimize}
  - {metric: python_calls, direction: minimize}
  - {metric: mcp_calls, direction: maximize}
  - {metric: skill_calls, direction: maximize}

budget:
  max_increments: 3
  max_cost_usd: .inf
