# mlkit SDK — a fake AutoML Python SDK (`import mlkit`) talking to a tiny local
# platform server. Source is co-located here and IS the base (v0) version;
# preflight builds + installs the wheel (no PyPI).
#
# Fake auth: `mlkit.login()` sends MLKIT_API_KEY to the platform (401 if empty):
#   banter setup interfaces/mlkit/sdk/config.yaml   (or `make setup`)

# `install:` only BUILDS the wheel into $INTERFACE_DIR — it does NOT install into
# the base .venv. Preflight verifies in a throwaway venv and each run installs
# (runtime_install) into its own venv, so the base stays free of interface pkgs.
install:
  - pip wheel . --no-deps --no-build-isolation -w $INTERFACE_DIR
auth_command: python -c "import mlkit; mlkit.login()"   # fake auth (401 if key empty)
test_command: python -c "import mlkit; assert mlkit.__version__"

binary: mlkit_sdk-0.1.0-py3-none-any.whl
runtime_install:
  - pip install --no-deps $INTERFACE_DIR/mlkit_sdk-0.1.0-py3-none-any.whl

# Stop the local platform server (port 8765) at run start + end so each challenge
# starts completely fresh and nothing persists across runs.
teardown:
  - 'P=$(lsof -ti tcp:8765 2>/dev/null); [ -n "$P" ] && kill $P 2>/dev/null || true'

keys:
  MLKIT_API_KEY: "mlkit"

prompt: |
  An `mlkit` Python SDK is installed and available. Use it to solve the
  competition:
    import mlkit
    mlkit.login()
    mlkit.fit("data")
    mlkit.predict(model_id, "data", "submission/submission.csv")
