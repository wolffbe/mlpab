# =============================================================================
# RQ1 — Improving the Hopsworks CLI, MCP, and SDK interfaces (NO skills)
# =============================================================================
#
# Research-question structure:
#   RQ1 (this file) = interface-only optimisation across CLI + MCP + SDK,
#                     run side-by-side in ONE autoresearch session.
#                     10 cycles × 3 interfaces × 8 challenges = up to 240 runs.
#   RQ3 (later)     = layer skills on top of the winning RQ1 versions
#                     for each interface, 10 cycles each.
#
# Hypothesis (RQ1): refining each interface's prompt and per-version config
# (no skills) is sufficient to achieve (1) higher MLE-bench task success,
# (2) lower token consumption, (3) lower latency, and (4) greater delegation
# to the remote Hopsworks platform — measured per-interface as cli_calls /
# mcp_calls / sdk_calls — over locally-executed Python.
#
# How the loop works:
#   Per cycle:
#     - Run every challenge with every interface (3 × 8 = 24 runs).
#     - Researcher Claude groups results.csv by interface, computes per-
#       interface AVERAGED metrics across the 8 challenges.
#     - Proposes ONE targeted change to ONE interface (so attribution is
#       clean) by appending a new entry under `versions:` in that
#       interface's manifest.
#     - Re-runs all 24 (interface × challenge) pairs.
#     - Keeps the change only if that interface's averaged goals improved
#       and no other interface regressed.
#   Repeats for max_cycles iterations.
#
# Prerequisites (one-time):
#   make setup    # auth for engineer + researcher, plus interface keys
#   # Interfaces are built, set up, and tested automatically at preflight.
#
# Run:
#   banter configs/autoresearch_rq1_hopsworks.yaml
#
# Versions are session-local (results/autoresearch/<id>/interfaces/...), so
# "resetting" is just deleting the session directory.
# =============================================================================

engineer_model: claude-sonnet-4-6
engineer_auth: api-key
researcher_model: claude-sonnet-4-6
researcher_auth: api-key

# -----------------------------------------------------------------------------
# Tasks (ML task type → its challenges). RQ1 = ONE challenge per task.
# -----------------------------------------------------------------------------
tasks:
  image_classification:   [aerial-cactus-identification]                  # 25 MB
  image_to_image:         [denoising-dirty-documents]                     # 60 MB
  text_classification:    [jigsaw-toxic-comment-classification-challenge] # 2 MB
  image_regression:       [histopathologic-cancer-detection]             # 7.76 GB
  audio_classification:   [mlsp-2013-birds]                              # 585 MB
  tabular:                [nomad2018-predict-transparent-conductors]      # 6 MB
  tabular_large:          [tabular-playground-series-dec-2021]            # 700 MB
  sequence_to_sequence:   [text-normalization-challenge-english-language] # 10 MB

# -----------------------------------------------------------------------------
# Three Hopsworks interfaces run side-by-side every increment, referenced by
# their config files (where each interface lives + how it is built/run).
# -----------------------------------------------------------------------------
interfaces:
  - config: configs/interfaces/hopsworks/cli.yaml
  - config: configs/interfaces/hopsworks/mcp.yaml
  - config: configs/interfaces/hopsworks/sdk.yaml
skills: none

# -----------------------------------------------------------------------------
# Improvement scope — INTERFACE ONLY (skills are RQ3)
# -----------------------------------------------------------------------------
improve:
  - interface

# -----------------------------------------------------------------------------
# Goals — direction-only. The researcher tracks each metric per interface.
# -----------------------------------------------------------------------------
# Note: by default every *_calls metric is treated as minimize. We override
# cli_calls, mcp_calls, and sdk_calls to MAXIMIZE — using the remote
# Hopsworks platform more is the whole point of this RQ.
goals:
  - metric: score                  # MLE-bench accuracy
    direction: maximize
  - metric: total_tokens           # cost / efficiency
    direction: minimize
  - metric: wall_time_s            # latency per challenge
    direction: minimize
  - metric: python_calls           # less local Python = more remote delegation
    direction: minimize
  - metric: cli_calls              # more Hopsworks CLI usage (only fires on cli runs)
    direction: maximize
  - metric: mcp_calls              # more Hopsworks MCP usage (only fires on mcp runs)
    direction: maximize
  - metric: sdk_calls              # more Hopsworks SDK usage (only fires on sdk runs)
    direction: maximize

# -----------------------------------------------------------------------------
# Budget — 10 increments × 3 interfaces × 8 challenges = up to 240 engineer runs.
# No cost cap.
# -----------------------------------------------------------------------------
budget:
  max_increments: 10
  max_cost_usd: .inf
