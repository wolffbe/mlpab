# Benchmark a specific Hopsworks SDK version against a set of challenges.
#
# Interface versions live inside the autoresearch session that produced them.
# Pin BOTH the session id and version to evaluate an evolved version (see
# results/autoresearch/<id>/increments.jsonl). Omit them for the base config.
#
# Run:
#   banter configs/benchmark_hopsworks_sdk.yaml

engineer_model: claude-sonnet-4-6
engineer_auth: api-key
timeout_s: 3600

challenges:
  - aerial-cactus-identification
  # add the challenges you want to score this version against

interfaces:
  - {config: configs/interfaces/hopsworks/sdk.yaml}
  # - {config: configs/interfaces/hopsworks/sdk.yaml, session: a1b2c3d4, version: 2}

skills:
  - none
