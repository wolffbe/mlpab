# Benchmark a specific Hopsworks SDK version against a set of challenges.
# Replace `version:` with whichever autoresearch-generated version you want
# to evaluate (look it up in results/autoresearch/<id>/cycles.jsonl).
#
# Run:
#   banter run configs/benchmark_hopsworks_sdk.yaml

model: claude-sonnet-4-6
auth: api-key
timeout_s: 3600

challenges:
  - aerial-cactus-identification
  # add the challenges you want to score this version against

interfaces:
  - {name: hopsworks, mode: sdk, version: 0}   # ← replace 0 with the target version

skills:
  - none
