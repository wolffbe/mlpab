# =============================================================================
# RQ2 — Specialised Hopsworks interfaces per ML task type
# =============================================================================
#
# RQ2 question: does optimising an interface for a SPECIFIC ML task type
# (image classification, tabular, …) produce a better interface than RQ1's
# one-size-fits-all version, AND does that specialised version generalise to
# other challenges in the same task type?
#
# This single config carries one ENTRY PER ML TASK TYPE under
# `challenge_groups:`. The researcher processes groups sequentially: for
# each task type, run `max_cycles` cycles of autoresearch using ONLY that
# group's challenges. Each group ends with a specialised interface version
# tagged for the task type. The benchmark phase (see
# configs/benchmark_hopsworks_<mode>.yaml) cross-evaluates those specialised
# versions against the other challenges in the same group.
#
# Limited to CLI + MCP per the RQ2 scope (no SDK).
#
# Cross-compatibility with RQ1/RQ3:
#   - Same manifests (configs/interfaces/hopsworks/{cli,mcp}.yaml).
#   - Version numbers grow monotonically per manifest; since RQ2 uses
#     DIFFERENT challenges than RQ1/RQ3 the intermixing is benign.
#   - Each cycle.jsonl entry MUST include `"group": "<task_type>"` so the
#     resulting versions can be cross-referenced back to ML task type.
#
# Run (once prerequisites are installed):
#   banter install configs/interfaces/hopsworks/cli.yaml
#   banter install configs/interfaces/hopsworks/mcp.yaml
#   banter run configs/autoresearch_rq2_hopsworks.yaml
#
# Reset (drops every version > 0 from cli + mcp manifests):
#   banter reset configs/autoresearch_rq2_hopsworks.yaml
# =============================================================================

model: claude-sonnet-4-6
auth: api-key
researcher_model: claude-sonnet-4-6

# -----------------------------------------------------------------------------
# Two-level hierarchy: ML task type → challenges in that type.
# Fill in additional challenges per type as MLE-bench coverage permits.
# (Three per type is the goal; one or two is acceptable if no third exists.)
# -----------------------------------------------------------------------------
challenge_groups:
  image_classification:
    - aerial-cactus-identification
    # - <add a second image-classification challenge>
    # - <add a third>

  image_to_image:
    - denoising-dirty-documents
    # - <second>
    # - <third>

  text_classification:
    - jigsaw-toxic-comment-classification-challenge
    # - <second>
    # - <third>

  image_regression:
    - histopathologic-cancer-detection
    # - <second>
    # - <third>

  audio_classification:
    - mlsp-2013-birds
    # - <second>
    # - <third>

  tabular:
    - nomad2018-predict-transparent-conductors
    - tabular-playground-series-dec-2021
    # - <third>

  sequence_to_sequence:
    - text-normalization-challenge-english-language
    # - <second>
    # - <third>

# -----------------------------------------------------------------------------
# CLI + MCP only for RQ2 (per "general-purpose vs special-purpose for cli+mcp").
# -----------------------------------------------------------------------------
starting_interfaces:
  - name: hopsworks
    mode: cli
  - name: hopsworks
    mode: mcp

starting_skills: none
improve:
  - interface

# Same goal set + directions as RQ1/RQ3 — direct comparability.
goals:
  - metric: score
    direction: maximize
  - metric: total_tokens
    direction: minimize
  - metric: wall_time_s
    direction: minimize
  - metric: python_calls
    direction: minimize
  - metric: cli_calls
    direction: maximize
  - metric: mcp_calls
    direction: maximize

# 10 cycles PER GROUP. Total runs ≈ 7 groups × 10 cycles × 2 interfaces ×
# challenges-per-group. Will be a long session — no cost cap.
budget:
  max_cycles: 10
  max_cost_usd: .inf
