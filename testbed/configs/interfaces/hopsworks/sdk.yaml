# Install manifest for the Hopsworks Python SDK interface.
#
# Install:   banter install configs/interfaces/hopsworks/sdk.yaml
# Uninstall: banter uninstall configs/interfaces/hopsworks/sdk.yaml

# --- Runtime defaults (per-run, into the fresh per-run venv) ---
runtime_install:
  - pip install hopsworks

# --- Versions ---
versions:
  0:
    prompt: |
      The Hopsworks Python SDK is available (`import hopsworks`; connect with
      `hopsworks.login()` using HOPSWORKS_API_KEY and HOPSWORKS_HOST from the
      environment). Use it when it helps. You can also use local Python or
      install other libraries — pick whatever solves the task best.
