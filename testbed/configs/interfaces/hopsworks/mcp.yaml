# Install manifest for the Hopsworks MCP interface.
#
# Install:   banter install configs/interfaces/hopsworks/mcp.yaml
# Uninstall: banter uninstall configs/interfaces/hopsworks/mcp.yaml

# --- Install-time (TODO: set repo + install steps when the MCP server is available) ---
repo: null
ref: main
install:
  - "echo 'TODO: set repo + install in configs/interfaces/hopsworks/mcp.yaml'"
  - "false"

# --- Runtime defaults ---
mcp_servers:
  hopsworks:
    command: hopsworks-mcp
    args: []
    env: {}

# --- Versions ---
versions:
  0:
    prompt: |
      Hopsworks MCP server tools (prefixed `mcp__hopsworks__`) are available.
      Use them when they help. You can also use local Python or install
      other libraries — pick whatever solves the task best.
