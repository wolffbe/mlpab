# Hopsworks CLI interface — config (where it lives + how to build/run it).
#
# This file holds NO versions. The base prompt below is version 0. Improved
# versions are created *inside* an autoresearch session, under
#   results/autoresearch/<session_id>/interfaces/hopsworks/cli/v<n>/version.yaml
# and never mutate this file.
#
# Build:    automatic at preflight (runs the `install:` steps below).
# Set keys: banter setup configs/interfaces/hopsworks/cli.yaml   (or `make setup`)

# --- Where it lives / how to build it (run automatically at preflight) ---
repo: https://github.com/MagicLex/hopsworks-cli
ref: main
install:
  # The built binary is written into the interface's binary dir:
  #   interfaces/hopsworks/cli/   ($INTERFACE_DIR)
  - go build -o $INTERFACE_DIR/hops .
# Non-interactive when HOPSWORKS_API_KEY / HOPSWORKS_HOST are present (see keys);
# also used by preflight as the login check (exit 0 = authenticated).
auth_command: hops login
# Deterministic "does it actually run?" check (no AI). Preflight runs this with
# the binary on PATH and the keys in the environment; exit 0 = healthy.
test_command: hops --help

# --- How to run it (per engineer run) ---
binary: hops
runtime_install:
  - cp $INTERFACE_DIR/hops $VIRTUAL_ENV/bin/hops

# --- Credentials (values live here; `banter setup <manifest>` fills them;
#     injected into the engineer's environment for each run) ---
keys:
  HOPSWORKS_API_KEY: ""
  HOPSWORKS_HOST: ""

# --- Base prompt (version 0) ---
prompt: |
  The Hopsworks `hops` CLI is installed and you are already authenticated.
  Use `hops <subcommand>` for all Hopsworks operations. Run `hops --help` to list available commands.
