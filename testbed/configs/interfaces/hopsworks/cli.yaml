# Install manifest for the Hopsworks CLI interface — single source of truth.
#
# Install:   banter install configs/interfaces/hopsworks/cli.yaml
# Uninstall: banter uninstall configs/interfaces/hopsworks/cli.yaml
# Reset:     banter reset configs/autoresearch_rq1_hopsworks.yaml  (clears versions > 0)

# --- Install-time (run once by `banter install`) ---
repo: https://github.com/MagicLex/hopsworks-cli
ref: main
install:
  - go build -o $INTERFACE_DIR/hops .
auth_command: hops login

# --- Runtime defaults (per-run; versions can override) ---
binary: hops
runtime_install:
  - cp $INTERFACE_DIR/hops $VIRTUAL_ENV/bin/hops

# --- Versions (0 = base; autoresearch appends 1, 2, ...) ---
versions:
  0:
    prompt: |
      The Hopsworks `hops` CLI is installed and you are already authenticated.
      Use `hops <subcommand>` for all Hopsworks operations. Run `hops --help` to list available commands.
  # Autoresearch appends new versions here, e.g.:
  # 1:
  #   prompt: |
  #     ...improved prompt...
  #   # Optional per-version overrides:
  #   # runtime_install:
  #   #   - cp $INTERFACE_DIR/hops $VIRTUAL_ENV/bin/hops
