# CLI cost/wall-time optimization experiment — opt1-batch
# Adds `hops batch` (many commands, one process / one login)
#
# Paired A/B: the 5.1+alerting BASELINE cli (control) and the isolated opt1-batch
# variant, opus, no skills, on identical tasks. The two interfaces build into
# SEPARATE homes (build/hopsworks/cli vs build/hopsworks/cli-opt1-batch) and are both
# accounted/graded as base "cli". Runs within this config are SEQUENTIAL (one
# project on the cluster at a time). To parallelise, launch several of these
# treatments as separate `mlpab start` sessions — each run mints its own unique
# HOPSWORKS_PROJECT and teardown is scoped to it, so sessions don't collide.
# Compare cost_usd / wall_time_s / interface_calls between the `version` values
# 5.1+alerting and 5.1+opt1-batch in results.csv.
model:
  - claude-opus-4-8
auth: login
n: 1

max_seconds: 3600

tasks:
  feature: [ingest, backfill, mit, validate, incremental_load, full_reload, training_data, leakage]
  training: [train, mdt, register, llm_finetuning]
  inference: [batch, online, odt, skew, llm_serving, recsys, vector_search]
  ops: [drift, prediction_monitoring, scheduled_jobs, alerting, lineage]
  capstone: [ccfraud, airquality]

interfaces:
  - {config: configs/platforms/hopsworks/cli-opt1-batch.yaml}

skills:
  - none
