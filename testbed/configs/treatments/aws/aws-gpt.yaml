# FTI benchmark — the gpt model family on aws.
#
# One (family × platform) cell of the grid: every implemented FTI task across
# all 3 gpt models × (CLI, SDK) × (no-skills, official skills).
# The model list expands into one run per model. Configs for DIFFERENT
# platforms run in PARALLEL; never run two configs of the SAME platform at
# once (per-run teardown sweeps it).
#
#   mlpab configs/treatments/aws/aws-gpt.yaml
model: [gpt-5.5, gpt-5.4-mini, gpt-5.4-nano]
auth: login
n: 1            # repeats per cell; every repeat gets a FRESH seeded instance
max_seconds: 1200

# One task per implemented FTI sub-category (extend as generators land —
# see mlpab/evals_provider.py FAMILIES and docs/eval-catalog.md).
tasks:
  feature: [ingest, backfill, mit, validate, incremental_load, full_reload, training_data, leakage]
  training: [train, mdt, register, llm_finetuning]
  inference: [batch, online, odt, skew, llm_serving, recsys, vector_search]
  ops: [drift, prediction_monitoring, scheduled_jobs, alerting, lineage]
  capstone: [ccfraud, airquality]

interfaces:
  - {config: configs/platforms/aws/cli.yaml}
  - {config: configs/platforms/aws/sdk.yaml}

# `- none` is the no-skills arm; the platform bundle is the official-skills arm.
skills:
  - none
  - {config: configs/platforms/aws/skills.yaml}
