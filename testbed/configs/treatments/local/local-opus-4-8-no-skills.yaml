# LOCAL BASELINE — claude-opus-4-8, no platform, no skills.
#
# The same generated FTI tasks solved with plain local tooling (pandas in the
# run venv): the ceiling each platform path is compared against, and the
# control for "does the platform help or hinder". Platform-only asserts
# (jobs, endpoints, registries) are skipped-pass for this baseline; table and
# dataset deliverables land as submission/<name>.csv, detection answers as
# submission/answers.json (see the local-baseline section of prompts/agent.md).
#
# Safe to run in parallel with any platform config (touches no platform).
#
#   banter configs/treatments/local/local-opus-4-8-no-skills.yaml
model: claude-opus-4-8
auth: login
n: 1            # repeats per cell; every repeat gets a FRESH seeded instance
max_seconds: 3600

# One task per implemented FTI sub-category (extend as generators land —
# see banter/evals_provider.py FAMILIES and docs/eval-catalog.md).
tasks:
  feature: [ingest, backfill, mit, validate, incremental_load, full_reload, training_data, leakage]
  training: [train, mdt, register, llm_finetuning]
  inference: [batch, online, odt, skew, llm_serving, recsys, vector_search]
  ops: [drift, prediction_monitoring, scheduled_jobs, alerting, lineage]

interfaces:
  - {platform: none, interface: none}

skills:
  - none
