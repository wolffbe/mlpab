# LOCAL BASELINE — the claude model family, no platform, no skills.
#
# The same generated FTI tasks solved with plain local tooling (pandas in the
# run venv): the ceiling each platform path is compared against. The model list
# expands into one run per model. Platform-only asserts (jobs, endpoints,
# registries) are skipped-pass for this baseline. Safe to run in parallel with
# any platform config (touches no platform).
#
#   mlpab configs/treatments/local/local-claude.yaml
model: [claude-opus-4-8, claude-sonnet-4-6, claude-haiku-4-5]
auth: login
n: 1            # repeats per cell; every repeat gets a FRESH seeded instance
max_seconds: 1200

# One task per implemented FTI sub-category (extend as generators land —
# see mlpab/evals_provider.py FAMILIES and docs/eval-catalog.md).
tasks:
  feature: [ingest, backfill, mit, validate, incremental_load, full_reload, training_data, leakage]
  training: [train, mdt, register, llm_finetuning]
  inference: [batch, online, odt, skew, llm_serving, recsys, vector_search]
  ops: [drift, prediction_monitoring, scheduled_jobs, alerting, lineage]
  capstone: [ccfraud, airquality]

interfaces:
  - {platform: none, interface: none}

skills:
  - none
