model:
  - claude-opus-4-8
auth: login
n: 1

max_seconds: 3600

# Only the tasks that did not get a clean result in run 1
# (1_hw-cli-sdk-no-skills-opus), re-run on both interfaces to validate the fixes
# and fill the gaps:
#   FAILED in run 1:
#     training_data / llm_serving / drift  - agent exited on a transport drop
#                                            (socket-retry fix)
#     alerting                             - get_alert grader false negative
#                                            (alerting grader fix); cli is a real
#                                            capability gap and stays failing
#     ccfraud                              - training-dataset split read fix
#   NEVER RAN in run 1:
#     airquality (cli+sdk), ccfraud (sdk), scheduled_jobs (cli)
tasks:
  feature: [training_data]
  inference: [llm_serving]
  ops: [drift, alerting, scheduled_jobs]
  capstone: [ccfraud, airquality]

interfaces:
  - {config: configs/platforms/hopsworks/cli.yaml}
  - {config: configs/platforms/hopsworks/sdk.yaml}

skills:
  - none