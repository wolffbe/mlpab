# Databricks model comparison — Mistral Medium. Parallels treatments 1-4
# (hopsworks), on Databricks: same FTI task suite, both interfaces (cli/sdk),
# with and without the vendor's official agent skills. Compare in results.csv by
# skills (none / official) and interface at fixed model+platform.

model:
  - mistral-medium-3-5
auth: login
n: 1

# Manual USD price per 1M tokens for models litellm can't price. Read first;
# if a model is absent here we fall back to litellm, and to 0 if that fails too.
# Mistral Medium 3.5: input $1.5/M, output $7.5/M.
prices:
  mistral-medium-3-5:
    input: 1.5
    output: 7.5

max_seconds: 3600

tasks:
  feature: [ingest, backfill, mit, validate, incremental_load, full_reload, training_data, leakage]
  training: [train, mdt, register, llm_finetuning]
  inference: [batch, online, odt, skew, llm_serving, recsys, vector_search]
  ops: [drift, prediction_monitoring, scheduled_jobs, alerting, lineage]
  capstone: [ccfraud, airquality]

interfaces:
  - {config: configs/platforms/databricks/cli.yaml}
  - {config: configs/platforms/databricks/sdk.yaml}

skills:
  - none
  - {config: configs/platforms/databricks/skills.yaml}
