# FTI benchmark — gpt-5.5 on sagemaker, with the vendor's official skill bundle.
#
# One cell-group of the grid: every implemented FTI task × (CLI, SDK), this
# platform and skills arm only. Configs for DIFFERENT platforms are safe to
# run in PARALLEL (each touches only its own platform; shared results.csv
# writes are lock-guarded; sessions sync at the build barrier). Never run two
# configs of the SAME platform at once — per-run teardown sweeps it.
#
#   banter configs/treatments/sagemaker/sagemaker-gpt-5.5-skills.yaml
# NOTE: OpenAI models run on the Codex CLI engine — codex auth must be set
# up first; adjust the id to what your codex install serves.
model: gpt-5.5
auth: login
n: 1            # repeats per cell; every repeat gets a FRESH seeded instance
max_seconds: 3600

# One task per implemented FTI sub-category (extend as generators land —
# see banter/evals_provider.py FAMILIES and docs/eval-catalog.md).
tasks:
  feature: [ingest, backfill, mit, validate, incremental_load, full_reload, training_data, leakage]
  training: [train, mdt, register, llm_finetuning]
  inference: [batch, online, odt, skew, llm_serving, recsys, vector_search]
  ops: [drift, prediction_monitoring, scheduled_jobs, alerting, lineage]

interfaces:
  - {config: configs/platforms/sagemaker/cli.yaml}
  - {config: configs/platforms/sagemaker/sdk.yaml}

skills:
  - {config: configs/platforms/sagemaker/skills.yaml, bundle: official}
