# Cross-platform SMOKE TEST — smallest task, smallest model, every platform
# except hopsworks (for now), with and without skills. Validates the end-to-end
# path (agent → platform feature group → grade-by-readback through the adapter)
# on databricks / aws / azure / gcp, plus a local (platform=none) control that
# needs no cloud creds and isolates harness issues from cloud issues.
#
#   mlpab run configs/treatments/smoketest.yaml      # inline
#   mlpab start configs/treatments/smoketest.yaml     # detached tmux
#
# `ingest` is the smallest platform task: full-load a feature table, read back
# through the adapter. haiku keeps it cheap/fast.
model: [claude-haiku-4-5, mistral-small-4]
auth: login
n: 1
max_seconds: 1200

tasks:
  feature: [ingest]

interfaces:
  - {config: configs/platforms/databricks/sdk.yaml}
  - {config: configs/platforms/aws/sdk.yaml}
  - {config: configs/platforms/azure/sdk.yaml}
  - {config: configs/platforms/gcp/sdk.yaml}
  - {platform: none, interface: none}        # local baseline control

# `- none` applies to every interface; each platform's skills.yaml applies only
# to that platform's runs (others dedupe back to none). So every cloud platform
# gets a no-skills AND an official-skills run; local gets no-skills only.
skills:
  - none
  - {config: configs/platforms/databricks/skills.yaml}
  - {config: configs/platforms/aws/skills.yaml}
  - {config: configs/platforms/azure/skills.yaml}
  - {config: configs/platforms/gcp/skills.yaml}
