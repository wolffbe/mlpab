# Minimal smoke treatment — claude-opus-4-8 on hopsworks, without skills.
#
# One representative task per FTI category (4 runs total) to validate the
# platform path end to end before launching a full treatment. Safe to run in
# PARALLEL with the other platforms' minimal configs; never run two configs
# of the SAME platform at once — per-run teardown sweeps it.
#
#   banter start configs/treatments/hopsworks/hopsworks-opus-4-8-minimal.yaml
model: claude-opus-4-8
auth: login
n: 1
max_seconds: 3600

tasks:
  feature: [ingest]
  training: [train]
  inference: [batch]
  ops: [drift]

interfaces:
  - {config: configs/platforms/hopsworks/sdk.yaml}
  # - {config: configs/platforms/hopsworks/cli.yaml}

skills:
  - none
