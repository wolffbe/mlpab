# FTI benchmark — feature pipelines on hopsworks (opus only, no-skills).
#
# One FTI category per config. claude-opus-4-8 × (CLI, SDK), no-skills only.
# PARALLEL-SAFE: every run mints a unique HOPSWORKS_PROJECT (runner.py) and
# setup/teardown are scoped to ONLY that project, so all five hopsworks
# category configs can run AT ONCE on one cluster without sweeping each
# other's work — alongside other platforms too.
#
#   mlpab configs/treatments/hopsworks/hopsworks-feature-opus-cli-sdk-no-skills.yaml
model: [claude-opus-4-8]
auth: login
n: 1            # repeats per cell; every repeat gets a FRESH seeded instance
max_seconds: 1200

# F — feature pipelines.
tasks:
  feature: [ingest, backfill, mit, validate, incremental_load, full_reload, training_data, leakage]

interfaces:
  - {config: configs/platforms/hopsworks/cli.yaml}
  - {config: configs/platforms/hopsworks/sdk.yaml}

# No-skills only.
skills:
  - none
