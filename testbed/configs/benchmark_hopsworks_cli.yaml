# Benchmark a specific Hopsworks CLI version against a set of challenges.
# Replace `version:` with whichever autoresearch-generated version you want
# to evaluate (look it up in results/autoresearch/<id>/cycles.jsonl).
#
# Use this template for cross-evaluation in RQ2 (test specialised versions
# against other challenges in the same task type) by listing the desired
# challenges and pinning the version produced by the matching autoresearch
# session.
#
# Run:
#   banter run configs/benchmark_hopsworks_cli.yaml

model: claude-sonnet-4-6
auth: api-key
timeout_s: 3600

challenges:
  - aerial-cactus-identification
  # add the challenges you want to score this version against

interfaces:
  - {name: hopsworks, mode: cli, version: 0}   # ← replace 0 with the target version

skills:
  - none
