# =============================================================================
# RQ3 — Skills layer on top of frozen RQ1/RQ2 interface winners
# =============================================================================
#
# Sequence:
#   RQ1 → autoresearch the interfaces (general-purpose, 8 challenges)
#         → produces winning versions for cli / mcp / sdk
#   RQ2 → autoresearch the interfaces specialised per challenge
#         → produces specialised winning versions (per category, per challenge)
#   RQ3 → freeze the winning interfaces, autoresearch a SKILL BUNDLE on top
#         → 10 cycles, interface only used as a constant
#
# This file is the RQ3 template for the GENERAL-PURPOSE (RQ1) winners. After
# RQ1 finishes, look at the cycle log to find each interface's winning
# version, then fill in the `version:` numbers below. For RQ2 specialised
# follow-ups, copy this file per category and pin the challenge-specific
# versions in `starting_interfaces:` plus restrict `challenges:` to the
# category's 3 challenges.
#
# Hypothesis (RQ3): given a fixed, RQ1-optimised interface, an autoresearch-
# generated skill bundle can extract further improvement on the same goals
# (task success, tokens, latency, remote-platform delegation) — i.e. skills
# are additive, not redundant with prompt refinements.
#
# Run:
#   1. First complete RQ1 and note the winning interface_version per mode
#      (from results/autoresearch/<id>/cycles.jsonl — the entry with the
#      best verdict and `keep: true` for each scope).
#   2. Fill in `version:` for each entry below.
#   3. Verify the pinned versions still exist (banter reset wipes >0):
#        ls interfaces/hopsworks/{cli,mcp,sdk}/<v>/
#   4. banter run configs/autoresearch_rq3_hopsworks_skills.yaml
#
# Reset (preserves the pinned interface versions; only clears skill versions):
#   banter reset configs/autoresearch_rq3_hopsworks_skills.yaml
# =============================================================================

model: claude-sonnet-4-6
auth: api-key
researcher_model: claude-sonnet-4-6

# Same 8 challenges as RQ1 — direct comparability of RQ3 (with skills) vs RQ1
# (without skills) on identical interface versions.
challenges:
  - aerial-cactus-identification
  - denoising-dirty-documents
  - jigsaw-toxic-comment-classification-challenge
  - histopathologic-cancer-detection
  - mlsp-2013-birds
  - nomad2018-predict-transparent-conductors
  - tabular-playground-series-dec-2021
  - text-normalization-challenge-english-language

# -----------------------------------------------------------------------------
# Starting interfaces — PINNED to RQ1 winners.
# Replace `version:` with the winning number from each RQ1 cycle log.
# -----------------------------------------------------------------------------
starting_interfaces:
  - name: hopsworks
    mode: cli
    version: 0      # ← REPLACE with the winning CLI version from RQ1
  - name: hopsworks
    mode: mcp
    version: 0      # ← REPLACE with the winning MCP version from RQ1
  - name: hopsworks
    mode: sdk
    version: 0      # ← REPLACE with the winning SDK version from RQ1

# No starting skill bundle. The researcher will create one and iterate it.
starting_skills: none

# -----------------------------------------------------------------------------
# Improvement scope — SKILLS ONLY. Interfaces are frozen at the RQ1 winners.
# -----------------------------------------------------------------------------
improve:
  - skills

# Same goals as RQ1 so we can compare apples to apples.
goals:
  - metric: score
    direction: maximize
  - metric: total_tokens
    direction: minimize
  - metric: wall_time_s
    direction: minimize
  - metric: python_calls
    direction: minimize
  - metric: cli_calls
    direction: maximize
  - metric: mcp_calls
    direction: maximize
  - metric: sdk_calls
    direction: maximize

# 10 cycles × 3 interfaces × 8 challenges = up to 240 solver runs.
budget:
  max_cycles: 10
  max_cost_usd: .inf
