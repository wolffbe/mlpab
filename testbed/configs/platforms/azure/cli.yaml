# Azure CLI interface — `az` + the `ml` extension (`az ml ...`).
# Docs: https://learn.microsoft.com/en-us/cli/azure/ml
#
# `az` is pip-installable, so (like the SDK) there is no binary download — each
# run pip-installs the pinned azure-cli into its venv and adds the `ml`
# extension. Auth is a non-interactive service-principal login.
#
# Set keys: edit the global testbed/.env (see `keys:` below).
# 2.75.0 is the smallest release that installs on Python 3.13: <=2.74.0 pull
# `msal[broker]` → `pymsalruntime<0.18,>=0.17`, a range not published for
# Darwin/py3.13, so the install fails outright (no `az` binary at all).
version: "2.75.0"

runtime_install:
  - pip install "azure-cli==2.75.0"
  - az extension add -n ml --yes

cli_command: az
# `az ml` is the sanctioned surface; the PreToolUse hook allows the `az`
# binary with these first subcommands and denies other `az` groups.
# `monitor` is included because the grader reads alerting back through Azure
# Monitor metric-alert rules (evals/adapters/azure.py get_alert), so the
# ops/alerting task is only winnable via `az monitor metrics alert ...`.
cli_subcommand: [ml, monitor, login, account, configure]

# OFFLINE "does it run?" check.
test_command: az version

# Live auth: non-interactive service-principal login, then read the workspace.
auth_command: |
  sh -c 'set -e;
  az login --service-principal -u "$AZURE_CLIENT_ID" --certificate "$AZURE_CLIENT_CERTIFICATE_PATH" --tenant "$AZURE_TENANT_ID" --output none;
  az account set --subscription "$AZURE_SUBSCRIPTION_ID";
  az ml workspace show -n "$AZUREML_WORKSPACE_NAME" -g "$AZURE_RESOURCE_GROUP" --output none'

allowed_domains:
  - "management.azure.com"
  - "*.microsoftonline.com"
  - "login.microsoftonline.com"
  - "*.api.azureml.ms"
  - "*.azureml.ms"
  - "*.blob.core.windows.net"
  - "*.dfs.core.windows.net"
  - "*.azure.com"

serve:
  - './venv/bin/python "$MLPAB_PLATFORM_DIR/setup.py"'

teardown:
  - './venv/bin/python "$MLPAB_PLATFORM_DIR/teardown.py"'

keys:
  - AZURE_TENANT_ID
  - AZURE_CLIENT_ID
  - AZURE_CLIENT_CERTIFICATE_PATH
  - AZURE_SUBSCRIPTION_ID
  - AZURE_RESOURCE_GROUP
  - AZUREML_WORKSPACE_NAME
  - AZURE_LOCATION
  - AZUREML_FEATURE_STORE_NAME

prompt: |
  The Azure CLI is available as `az`, with the machine-learning commands under `az ml ...`. It is authenticated via
  a service principal (AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_CERTIFICATE_PATH) from the environment; the active
  subscription, resource group (AZURE_RESOURCE_GROUP) and workspace (AZUREML_WORKSPACE_NAME) are pre-configured.
  The managed feature store is named by AZUREML_FEATURE_STORE_NAME from the environment. Run `az ml --help` to see
  what it can do.
