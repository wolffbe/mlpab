# Azure Machine Learning Python SDK interface — azure-ai-ml (MLClient).
# Docs: https://learn.microsoft.com/en-us/python/api/overview/azure/ai-ml-readme
#
# Published PyPI package (no build-from-source): each agent run pip-installs the
# pinned SDK + azure-identity into its venv. Auth is a service principal whose
# AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_CERTIFICATE_PATH DefaultAzureCredential
# reads straight from the env.
#
# Set keys: edit the global testbed/.env (see `keys:` below).
# Latest stable. Python 3.13 floor (historical): 1.25.0 was the smallest release
# that imports on 3.13 — 1.23.1/1.24.0 raise `Plain typing.Annotated is not valid
# as type argument` at import on 3.13; anything from 1.25.0 up is fine.
version: "1.34.0"

runtime_install:
  # adlfs: the grader reads offline feature/training data back through the ADLS
  # data-asset URI (evals/adapters/azure.py read_rows → `import adlfs`), so
  # without it EVERY feature/training-dataset task fails grading.
  # azure-mgmt-monitor: the grader reads alerting through Azure Monitor
  # metric-alert rules (get_alert), and in SDK mode the agent needs it to CREATE
  # them — otherwise ops/alerting is ungradeable AND uncreatable.
  - pip install "azure-ai-ml==1.34.0" "marshmallow<4" "azure-identity==1.25.3" "azure-storage-file-datalake==12.25.0" "adlfs==2026.5.0" "azure-mgmt-monitor==7.0.0" "pyarrow>=14"

# Importable module → mlpab accounts `import azure.ai.ml…` as sdk_calls.
sdk_module: azure.ai.ml

# OFFLINE "does it import?" check (no Azure calls).
test_command: python -c "import azure.ai.ml, azure.identity, adlfs, azure.mgmt.monitor"

# Live connectivity + permission check: build an MLClient for the workspace from
# the service-principal env vars and read the workspace back. Exits non-zero on a
# bad principal / missing role assignment so preflight fails fast.
auth_command: |
  python - <<'AUTHCHECK'
  import os
  from azure.identity import DefaultAzureCredential
  from azure.ai.ml import MLClient
  ml = MLClient(DefaultAzureCredential(),
                os.environ["AZURE_SUBSCRIPTION_ID"],
                os.environ["AZURE_RESOURCE_GROUP"],
                os.environ["AZUREML_WORKSPACE_NAME"])
  ml.workspaces.get(os.environ["AZUREML_WORKSPACE_NAME"])
  AUTHCHECK

# Outbound hosts the agent needs (ARM control plane, AAD login, AML data plane,
# ADLS offline store).
allowed_domains:
  - "management.azure.com"
  - "*.microsoftonline.com"
  - "login.microsoftonline.com"
  - "*.api.azureml.ms"
  - "*.azureml.ms"
  - "*.blob.core.windows.net"
  - "*.dfs.core.windows.net"
  - "*.azure.com"

# Platform setup — ensure the Azure ML MANAGED FEATURE STORE exists (the FTI
# feature-store primitive the feature tasks land in) and export its name to the
# agent env as AZUREML_FEATURE_STORE_NAME via $MLPAB_PLATFORM_ENV. Committed
# logic in configs/platforms/azure/setup.py ($MLPAB_PLATFORM_DIR).
serve:
  - './venv/bin/python "$MLPAB_PLATFORM_DIR/setup.py"'

# Platform teardown — sweep agent-created resources (online/batch endpoints,
# jobs, registered models, feature sets + entities, data assets) in cost order,
# preserving the workspace + feature store themselves. Runs at run START + END.
teardown:
  - './venv/bin/python "$MLPAB_PLATFORM_DIR/teardown.py"'

# Credentials — names only; values resolve from the GLOBAL testbed/.env. The SP
# triple is what DefaultAzureCredential consumes; the rest scope the MLClient.
keys:
  - AZURE_TENANT_ID          # service-principal tenant
  - AZURE_CLIENT_ID          # service-principal app id
  - AZURE_CLIENT_CERTIFICATE_PATH  # PEM cert+key path (tenant blocks SP secrets; DefaultAzureCredential/az --certificate)
  - AZURE_SUBSCRIPTION_ID
  - AZURE_RESOURCE_GROUP
  - AZUREML_WORKSPACE_NAME   # the Azure ML workspace
  - AZURE_LOCATION           # e.g. eastus (used when setup.py creates the feature store)
  # OPTIONAL — normally LEAVE UNSET: setup.py ensures the managed feature store
  # (default name mlpab-fs) and exports AZUREML_FEATURE_STORE_NAME into the
  # agent env. Set it to force a specific pre-provisioned feature store.
  - {name: AZUREML_FEATURE_STORE_NAME, optional: true}

prompt: |
  The Azure Machine Learning Python SDK is available as `import azure.ai.ml` (connect with
  `MLClient(DefaultAzureCredential(), AZURE_SUBSCRIPTION_ID, AZURE_RESOURCE_GROUP, AZUREML_WORKSPACE_NAME)`).
  It is authenticated via a service principal (AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_CERTIFICATE_PATH) from the
  environment. The managed feature store is named by AZUREML_FEATURE_STORE_NAME from the environment. Use Python
  introspection (`help()`/`dir()`) on the package to see what it can do.
