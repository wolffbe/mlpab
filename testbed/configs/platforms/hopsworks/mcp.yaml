# Hopsworks MCP interface — the `hopsworks-mcp` server shipped IN hopsworks-api
# (python/hopsworks/mcp, console script `hopsworks-mcp` → hopsworks.mcp:run_server_command).
#
# Built LOCALLY from source (no PyPI): preflight builds the hopsworks wheel from
# the repo's python/ dir into $INTERFACE_DIR and each agent run installs THAT
# wheel (with the `[mcp]` extra) into its venv. Same wheel as the SDK + CLI
# interfaces — only the entry point (the MCP server) differs.
#
# Set keys: edit the global testbed/.env (see `keys:` below).

# --- Where it lives / how to build it (run automatically at preflight) ---
repo: https://github.com/logicalclocks/hopsworks-api
# Pinned to a FIXED COMMIT for reproducibility: the interface source never
# drifts between runs (the checkout is never re-pulled). To advance, update
# this SHA + delete the built src/.
ref: 6317e1cab5771a180e63e556148f6bb5e673fc79
install:
  # Build the wheel from source into $INTERFACE_DIR, then RENAME it to one fixed,
  # valid wheel filename (upstream version floats, e.g. 5.0.0.devN — `mv` leaves
  # exactly one wheel). pip reads the real version from
  # the wheel's own metadata, so the fixed `-0-` name is cosmetic.
  - pip install build
  - python -m build --wheel --outdir "$INTERFACE_DIR" python
  - sh -c 'mv "$(ls -t "$INTERFACE_DIR"/hopsworks-*.whl | head -1)" "$INTERFACE_DIR/hopsworks-0-py3-none-any.whl"'

# Deterministic, OFFLINE "does it run?" check (no live cluster): the server
# command installs and responds to --help.
test_command: hopsworks-mcp --help

# Real connectivity check: the MCP server connects with HOPSWORKS_API_KEY /
# HOPSWORKS_HOST at runtime, so validate those same credentials at preflight via
# `hops login` (shipped in the same wheel). Non-interactive when both are set,
# exits non-zero on a bad/missing key; `--no-save-key` leaves no state behind.
auth_command: hops login --no-save-key

# --- How to run it (per agent run) — install the locally-built wheel with
#     the `[mcp]` extra (the MCP server deps); `[python]` for SDK deps too. ---
binary: hopsworks-0-py3-none-any.whl
# The `hops` console script ships in the same wheel. It is NOT the interface
# under test here — declaring it lets the agent hook + command counter treat
# a `hops …` call as an OFF-INTERFACE escape (blocked / counted as such).
cli_command: hops
runtime_install:
  - 'pip install "$INTERFACE_DIR/hopsworks-0-py3-none-any.whl[mcp,python,trino]"'

# --- Platform setup — run automatically by mlpab at the START of every run,
#     right AFTER the teardown wipe below, so each run starts with exactly
#     ONE fresh, empty project for the agent to work in (its `hopsworks.login()` selects the single project with
#     no prompt). Created for every interface. The logic is the committed
#     platforms/hopsworks/setup.py — $MLPAB_PLATFORM_DIR points there (fixed
#     infra); `./venv` is the agent's run venv (the SDK is installed there).
#     Removal is handled by the teardown below (deletes every project this key
#     owns at run start + end). ---
serve:
  - './venv/bin/python "$MLPAB_PLATFORM_DIR/setup.py"'

# --- Platform teardown — run automatically by mlpab at the START and END of
#     every run, so each run starts and ends with a clean cluster. Deletes every project this API key owns, which
#     cascades away all feature groups / views / training data / models the agent
#     created (POST /hopsworks-api/api/project/{id}/delete) — including the empty
#     project setup.py creates. The cleanup logic is the committed
#     platforms/hopsworks/teardown.py — $MLPAB_PLATFORM_DIR points
#     there, so it's fixed infra; `./venv` is the agent's run venv
#     (the SDK is installed there). ---
teardown:
  - './venv/bin/python "$MLPAB_PLATFORM_DIR/teardown.py"'

# --- MCP server: Claude Code launches it over stdio per run (reads the keys
#     below from the environment to connect to Hopsworks). ---
mcp_servers:
  hopsworks:
    command: hopsworks-mcp
    args: ["--transport", "stdio"]
    env: {}

# --- Credentials — names only; values resolve from the GLOBAL testbed/.env at
#     run time (never stored here), injected into the agent's env AND the MCP
#     server's. ---
keys:
  - HOPSWORKS_API_KEY   # secret
  - HOPSWORKS_HOST      # Hopsworks endpoint

# --- Agent-facing prompt ---
prompt: |
  Hopsworks MCP server tools (prefixed `mcp__hopsworks__`) are available and
  authenticated via HOPSWORKS_API_KEY and HOPSWORKS_HOST from the environment.
  Use them for Hopsworks operations when they help.
