# Hopsworks skill bundles — pointer manifest. `official` is the vendor's
# published agent skills, fetched AT RUNTIME into the gitignored build home
# (build/hopsworks/skills/official/) on first use, pinned to a FIXED commit
# for reproducibility (never re-pulled; bump the sha + delete the build dir
# to advance). The repo nests skills in category dirs (data/hops/ml/platform);
# the fetcher flattens them automatically.
bundles:
  official:
    repo: https://github.com/logicalclocks/hopsworks-api
    ref: 81be421e670e3932a6dbaf41d0a8f0265c746f55
    path: skills
