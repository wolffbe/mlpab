# Google Cloud CLI interface — `gcloud` (with `gcloud ai ...` for Gemini Enterprise Agent Platform).
# Docs: https://cloud.google.com/sdk/gcloud/reference/ai
#
# Distributed as a prebuilt archive (NOT pip): preflight downloads the pinned
# Cloud SDK tarball into $INTERFACE_DIR (the gitignored build home); each run
# copies the SDK tree into its venv (the build dir isn't readable inside the
# sandbox) and symlinks `gcloud` onto PATH. Auth is a service-account activation.
#
# Set keys: edit the global testbed/.env (see `keys:` below).
version: "573.0.0"

install:
  - >-
    sh -c 'set -e;
    VER=573.0.0;
    OS=$(uname -s | tr "[:upper:]" "[:lower:]");
    ARCH=$(uname -m);
    case "$ARCH" in x86_64|amd64) ARCH=x86_64 ;; arm64|aarch64) ARCH=arm ;; esac;
    curl -fsSL "https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-cli-${VER}-${OS}-${ARCH}.tar.gz"
    | tar -xz -C "$INTERFACE_DIR" google-cloud-sdk'

# The gcloud entrypoint inside the extracted tree (a single launcher script);
# its bytes are folded into the interface hash.
binary: google-cloud-sdk/bin/gcloud
cli_command: gcloud
# `monitoring` is on-interface because the grader reads alerting back through
# Cloud Monitoring alert policies (evals/adapters/gcp.py get_alert).
cli_subcommand: [ai, auth, config, components, storage, monitoring]

# Auxiliary on-interface binaries shipped INSIDE the same Cloud SDK. Unlike AWS
# (one `aws` binary for every service), GCP splits the offline store onto a
# SEPARATE binary: the feature store is BigQuery-backed and the grader reads it
# straight through the BigQuery client (evals/adapters/gcp.py), but `gcloud` has
# no table create/load — only `bq` does. Without it, every feature/* and
# training-dataset task is unwinnable in CLI mode. Allowed with any subcommand.
cli_aux_commands: [bq]

# Copy the SDK tree INTO the run venv (sandbox-readable) and put gcloud + bq on PATH.
runtime_install:
  - 'cp -R "$INTERFACE_DIR/google-cloud-sdk" ./venv/google-cloud-sdk'
  - 'ln -sf "../google-cloud-sdk/bin/gcloud" ./venv/bin/gcloud'
  - 'ln -sf "../google-cloud-sdk/bin/bq" ./venv/bin/bq'

# OFFLINE "does it run?" check.
test_command: gcloud version

# Live auth: gcloud authenticates via CLOUDSDK_AUTH_ACCESS_TOKEN — a bearer token
# setup.py mints from ADC and exports through $MLPAB_PLATFORM_ENV (the agent
# inherits the same token). This avoids `gcloud auth activate-service-account`,
# which needs a service-account KEY file and rejects the impersonated-SA ADC
# file this project uses. Just a cheap authenticated read here.
auth_command: |
  sh -c 'set -e;
  gcloud ai models list --region="$GCP_LOCATION" --project="$GCP_PROJECT" --limit=1 >/dev/null'

allowed_domains:
  - "*.googleapis.com"
  - "oauth2.googleapis.com"
  - "aiplatform.googleapis.com"
  - "bigquery.googleapis.com"
  - "storage.googleapis.com"
  - "dl.google.com"
  - "*.google.com"

# gcloud (like gh/terraform) cannot reach the macOS trust daemon inside the
# Seatbelt sandbox → TLS handshakes fail; run it OUTSIDE the sandbox. It only
# talks to Google APIs, and the PreToolUse hook still enforces the exec
# allowlist + path denies on every call. `bq` ships in the same SDK and hits the
# same TLS wall, so it is excluded too.
sandbox_excluded_commands:
  - "gcloud"
  - "gcloud *"
  - "bq"
  - "bq *"

# Plumbing (setup/teardown) needs the BigQuery/aiplatform PYTHON client, which a
# CLI run venv lacks (gcloud ships as a tarball, not pip). Run them under
# $MLPAB_PLUMBING_PY — mlpab's per-platform plumbing venv that always has the
# client — so the agent's run venv stays CLI-only.
serve:
  - '"$MLPAB_PLUMBING_PY" "$MLPAB_PLATFORM_DIR/setup.py"'

teardown:
  - '"$MLPAB_PLUMBING_PY" "$MLPAB_PLATFORM_DIR/teardown.py"'

keys:
  - GCP_PROJECT
  - GCP_LOCATION
  - GOOGLE_APPLICATION_CREDENTIALS
  - GCP_BQ_DATASET

prompt: |
  The Google Cloud CLI is available as `gcloud`, with Gemini Enterprise Agent Platform commands under `gcloud ai ...`. It is authenticated
  via a service account (GOOGLE_APPLICATION_CREDENTIALS) from the environment; the project (GCP_PROJECT) and region
  (GCP_LOCATION) are pre-configured. The feature store is backed by the BigQuery dataset GCP_BQ_DATASET (query it
  with `bq` or `gcloud`). Run `gcloud ai --help` to see what it can do.
