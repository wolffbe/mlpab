# SageMaker skill bundles — pointer manifest. `official` is the vendor's
# published agent skills from the sagemaker-ai plugin (skills only — the
# plugin's MCP server and commands are excluded via `path:`), fetched AT
# RUNTIME into the gitignored build home (build/sagemaker/skills/official/)
# on first use, pinned to a FIXED commit for reproducibility (never
# re-pulled; bump the sha + delete the build dir to advance).
bundles:
  official:
    repo: https://github.com/awslabs/agent-plugins
    ref: 58373593c6ed2e4684181f81369c0b7a4c916423
    path: plugins/sagemaker-ai/skills
