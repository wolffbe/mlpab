workerPoolSpecs:
- machineSpec:
    machineType: e2-standard-4
  replicaCount: 1
  containerSpec:
    imageUri: europe-docker.pkg.dev/vertex-ai/training/sklearn-cpu.1-0:latest
    command:
    - bash
    - -c
    - |
      set -e
      python3 -m pip install -q google-cloud-storage numpy 2>/dev/null || true
      python3 - <<'PY'
      from google.cloud import storage
      B = "cloud-ai-platform-5dcfee9a-d8bf-457a-8b19-6d8f5db58035"
      P = "mlpab7c59f3_ftjob2e5343"
      c = storage.Client()
      bk = c.bucket(B)
      for n in ["base_model.npz", "finetune.txt", "eval.txt"]:
          bk.blob(P + "/input/" + n).download_to_filename(n)
          print("downloaded", n, flush=True)
      bk.blob(P + "/code/finetune_model.py").download_to_filename("finetune_model.py")
      import finetune_model
      finetune_model.main()
      for n in ["finetuned_model.npz", "metrics.json"]:
          bk.blob(P + "/output/" + n).upload_from_filename(n)
          print("uploaded", n, flush=True)
      print("METRICS:", open("metrics.json").read(), flush=True)
      PY
