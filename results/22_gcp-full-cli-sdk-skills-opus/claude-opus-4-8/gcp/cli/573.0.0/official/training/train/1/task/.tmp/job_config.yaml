workerPoolSpecs:
- machineSpec:
    machineType: e2-standard-4
  replicaCount: 1
  containerSpec:
    imageUri: us-docker.pkg.dev/vertex-ai/training/sklearn-cpu.1-0:latest
    command:
    - python
    - -c
    - |-
      import os, subprocess, sys
      os.chdir('/tmp')
      from google.cloud import storage
      c = storage.Client()
      base = 'cloud-ai-platform-5dcfee9a-d8bf-457a-8b19-6d8f5db58035'
      prefix = 'mlpab029ad4_trainjob6329cd'
      def dl(blob, local):
          c.bucket(base).blob(prefix + '/' + blob).download_to_filename(local)
      def ul(local, blob):
          c.bucket(base).blob(prefix + '/' + blob).upload_from_filename(local)
      dl('inputs/train.csv', 'train.csv')
      dl('inputs/score.csv', 'score.csv')
      dl('code/train_model.py', 'train_model.py')
      subprocess.run([sys.executable, 'train_model.py'], check=True, cwd='/tmp')
      ul('predictions.csv', 'outputs/predictions.csv')
      print('PREDICTIONS_UPLOADED', prefix + '/outputs/predictions.csv')
